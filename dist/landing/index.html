<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجز منتج | X-Space</title><style>
[hidden]{display:none!important}body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f5f8fc;color:#090936}header{background:white;padding:6px 16px;height:40px;display:flex;direction:ltr;align-items:center;font-size:26px;color:#087bee;font-weight:bold;position:sticky;top:0}main{max-width:660px;margin:auto;padding:20px}.box{background:white;border-radius:20px;padding:22px;margin:14px 0}img{width:100%;height:320px;object-fit:contain;border-radius:16px}.gallery{display:flex;gap:8px;overflow:auto}.gallery img{width:90px;height:90px;cursor:pointer}label{display:block;margin:16px 0 6px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:14px;border:1px solid #dce4ee;border-radius:12px;font:inherit}button{background:#087bee;color:white;border:0;margin-top:20px;cursor:pointer}.amount{color:#087bee;font-weight:bold;font-size:28px}.note{color:#667085;font-size:13px;line-height:1.8}#error{color:#c62828}a{display:block;padding:15px;background:#087bee;color:white;border-radius:12px;text-decoration:none} </style></head><body><header><img src="assets/logo.png" alt="X-Space" style="width:132px;height:40px;object-fit:contain"></header><main>
<section class="box"><img id="hero" hidden alt="صورة المنتج"><div id="remote-gallery" class="gallery"></div>
<h1>جارٍ تحميل المنتج…</h1><p></p><p class="amount"></p><p></p></section>
<form id="booking" class="box"><h2>احجز المنتج</h2><label>اسم الزبون</label><input name="name" required maxlength="100"><label>الهاتف</label><input name="phone" required inputmode="tel" dir="ltr" placeholder="07xxxxxxxxx"><label>المحافظة</label><select name="province" required><option value="">اختر المحافظة</option><option>بغداد</option><option>البصرة</option><option>نينوى</option><option>أربيل</option><option>النجف</option><option>كربلاء</option><option>بابل</option><option>الأنبار</option><option>ديالى</option><option>واسط</option><option>صلاح الدين</option><option>كركوك</option><option>السليمانية</option><option>دهوك</option><option>ذي قار</option><option>المثنى</option><option>ميسان</option><option>القادسية</option><option>حلبجة</option></select><label>العنوان</label><input name="address" required maxlength="250"><label>الكمية</label><input name="quantity" type="number" min="1" max="5" value="1" required>
<label>اللون</label><select name="color"><option>أسود</option></select>
<label>القياس</label><select name="size"><option>M</option></select>
<label>ملاحظات</label><textarea name="note" maxlength="500"></textarea><p id="total" class="amount"></p><p id="error" role="alert"></p><button>إرسال طلب الحجز</button><p class="note">يُسجل الحجز مباشرة في X-Space. تأكد من بياناتك قبل الإرسال.</p><p id="success" role="status" hidden></p></form></main><script>
const data={"id":"","name":"منتج \u003cscript>","price":20000,"free":false,"url":"https://typbkzwbrmkrfkfxjrgi.supabase.co","key":"sb_publishable_Oto-5IRPHgWceHq_uzrsiw_JBBZbAOT","delivery":5000,"stock":5},form=document.getElementById('booking');data.id=new URLSearchParams(location.search).get('page')||'';
const digits=s=>s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
const update=()=>{const q=Number(form.elements.quantity.value)||0;document.getElementById('total').textContent='الإجمالي: '+(q*data.price+(data.free?0:data.delivery)).toLocaleString('en-US')+' د.ع';};form.elements.quantity.addEventListener('input',update);update();
document.querySelectorAll('.gallery img').forEach(img=>img.addEventListener('click',()=>document.getElementById('hero').src=img.src));

async function renderMedia(product){
 const gallery=document.getElementById('remote-gallery'),hero=document.getElementById('hero');
 const media=product.media&&product.media.length?product.media:product.image?[{asset:product.image}]:[];
 for(const raw of media.slice(0,12)){
  const m=typeof raw==='string'?{asset:raw}:raw;
  if(!m.asset)continue;
  const src=m.asset.startsWith('assets/')?'./'+m.asset:m.asset;
  if(!src.startsWith('./assets/')&&!src.startsWith('https://'))continue;
  try{
   const img=new Image();img.crossOrigin='anonymous';img.src=src;await img.decode();let result=src;
   if(Array.isArray(m.crop)&&m.crop.length===4){const canvas=document.createElement('canvas');canvas.width=m.crop[2];canvas.height=m.crop[3];canvas.getContext('2d').drawImage(img,...m.crop,0,0,canvas.width,canvas.height);result=canvas.toDataURL('image/png');}
   const thumb=document.createElement('img');thumb.src=result;thumb.alt=product.name||'المنتج';thumb.addEventListener('click',()=>{hero.src=result;hero.hidden=false});gallery.append(thumb);if(hero.hidden){hero.src=result;hero.hidden=false;}
  }catch(_){}
 }
}

let ready=false,busy=false;
const button=form.querySelector('button');button.disabled=true;
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const rpc=async(name,args)=>{const response=await fetch(data.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:data.key,'Content-Type':'application/json'},body:JSON.stringify(args)});const result=await response.json();if(!response.ok)throw new Error(result.message||'تعذر الاتصال');return result;};
const storage={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}}};
let key=storage.get('x-booking-'+data.id)||uuid();storage.set('x-booking-'+data.id,key);
let visitor=storage.get('x-visitor')||uuid();storage.set('x-visitor',visitor);
const options=(field,values)=>{let select=form.elements[field];if(!select&&values.length){const label=document.createElement('label');label.textContent=field==='color'?'اللون':'القياس';select=document.createElement('select');select.name=field;form.insertBefore(label,form.elements.note);form.insertBefore(select,form.elements.note)}if(select){select.replaceChildren(...values.map(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;return option}));select.disabled=!values.length;}};
rpc('x_public_landing',{p_id:data.id}).then(page=>{document.querySelector('h1').textContent=page.product.name;document.querySelector('section.box>p').textContent=page.product.description||'';document.querySelector('section.box .amount').textContent=Number(page.sale).toLocaleString('en-US')+' د.ع';document.querySelector('section.box>p:last-child').textContent=page.freeDelivery?'توصيل مجاني':'التوصيل: '+Number(page.deliveryCost||5000).toLocaleString('en-US')+' د.ع';renderMedia(page.product);data.price=page.sale;data.free=page.freeDelivery;data.delivery=Number(page.deliveryCost||5000);data.stock=page.product.stock;form.elements.quantity.max=data.stock;options('color',(page.product.colors||[]).filter(c=>c&&c!=='قياسي'));options('size',page.product.sizes||[]);ready=data.stock>0;button.disabled=!ready;if(!ready)document.getElementById('error').textContent='المنتج غير متوفر حالياً';update();rpc('x_visit_landing',{p_page:data.id,p_visitor:visitor}).catch(()=>{});}).catch(error=>{document.getElementById('error').textContent=error.message;});
form.addEventListener('submit',async e=>{e.preventDefault();if(!ready||busy)return;const phone=digits(form.elements.phone.value).replace(/[\s()-]/g,'');const q=Number(form.elements.quantity.value);const error=document.getElementById('error');if(!/^07[0-9]{9}$/.test(phone)){error.textContent='الهاتف يجب أن يبدأ بـ07 ويتكون من 11 رقمًا';return;}if(!Number.isInteger(q)||q<1||q>data.stock){error.textContent='راجع الكمية';return;}const f=new FormData(form);busy=true;button.disabled=true;error.textContent='';try{const id=await rpc('x_public_booking',{p_page:data.id,p_key:key,p_customer:{name:String(f.get('name')).trim(),phone,phone2:'',province:f.get('province'),address:String(f.get('address')).trim(),note:f.get('note')||''},p_quantity:q,p_color:f.get('color')||'',p_size:f.get('size')||''});const success=document.getElementById('success');success.textContent='تم تسجيل طلبك بنجاح. سنتواصل معك لتوصيله';success.hidden=false;form.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);button.hidden=true;key=uuid();storage.set('x-booking-'+data.id,key);}catch(err){error.textContent=err.message;button.disabled=false;}finally{busy=false;}});
</script></body></html>
